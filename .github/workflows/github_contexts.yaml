name: github-context
on: workflow_dispatch
env:
    runner: ${{ github.ref_name }}
jobs:
  contexts_test:
    runs-on: ubuntu-latest
    steps:
       - name: env_context
         run: echo 'its main ${{ env.runner }}' #env context
       - name: github_context
         run: echo '${{ github.run_id }}'  # Github_context
       - name: jobs_context
         run: echo '${{ job.status }}-${{ job.workflow_repository }}'
