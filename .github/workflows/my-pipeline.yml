name: my-pipeline
on: 
  workflow_dispatch:
   inputs: 
      environment:
        description: prod or dev
        type: choice
        default: dev
        options:
          - prod
          - dev

jobs:
  hello:
   runs-on: ubuntu-latest
   steps:
     - name: Show target
       if: ${{ inputs.environment }} == "prod":
       run: "echo target Environment:${{ inputs.environment }}"
   
   
   
