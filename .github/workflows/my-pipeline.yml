name: my-pipeline
on: 
  workflow_dispatch:
   inputs: 
      environment:
        description: prod or dev
        type: choice
        default: dev
        options:
          - prod
          - dev

jobs:
  hello:
   runs-on: ubuntu-latest
   steps:
     - name: Show target
       run: |
          if [ "${{ inputs.environment }} != 'prod' ]; then
             echo "Only prod is allowed"
             exit 1
          fi
          echo "Target environment: ${{ inputs.environment }}"
   
   
   
