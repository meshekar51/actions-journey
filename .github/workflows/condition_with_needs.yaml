name: conditionals with needs
on: workflow_dispatch

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: ls
      - name: Deploy
        if: ${{ github.ref == 'refs/heads/feature' }}
        run: df -h
  build:
    runs-on: ubuntu-latest
    needs: test-job
    steps:
      - name: Notify Slack Cancelled
        if: cancelled()
        run: |
          echo "why it is cancelled"
     
     
     
      
  
