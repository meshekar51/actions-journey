name: tests
on: push
jobs:
  matrix1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: python-action
        uses: actions/setup-python@5
        with:
          python_version: ${{ matrix.python-version }}
      - name: pytest
        run: python3 -c "import sys; print(sys.version)" 
            
