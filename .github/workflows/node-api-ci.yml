name: Node API CI

permissions:
  contents: read

on: 
  pull_request:
    branches: [main]
    paths:
      apps/node-api/**
jobs:
  nodejs-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/node-api/package-lock.json
      - name: run npm
        run: |
          npm ci
          npm test
