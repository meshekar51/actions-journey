
name: Terraform AWS Deployment

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/approval_gate.yaml"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/approval_gate.yaml"

  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================
  # JOB 1 - FORMAT AND VALIDATE
  # ============================================
  validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

  # ============================================
  # JOB 2 - TERRAFORM PLAN
  # ============================================
  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    outputs:
      changes: ${{ steps.tfplan.outputs.changes }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      # Check configuration before AWS login
      - name: Validate AWS OIDC Configuration
        env:
          ROLE_ARN: ${{ vars.TF_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::TF_PLAN_ROLE_ARN is missing"
            exit 1
          fi

          if [[ "$ROLE_ARN" != arn:aws:iam::136283260189:role/* ]]; then
            echo "::error::Invalid AWS role ARN"
            exit 1
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::GitHub OIDC is unavailable"
            exit 1
          fi

          echo "AWS role variable configured"
          echo "GitHub OIDC available"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: TerraformPlan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false

      - name: Generate Terraform Plan
        id: tfplan
        run: |
          set +e

          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out=tfplan

          code=$?
          set -e

          if [ "$code" -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1

          elif [ "$code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Infrastructure changes detected"

          elif [ "$code" -eq 0 ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No infrastructure changes"

          else
            echo "Unexpected Terraform exit code: $code"
            exit 1
          fi

      - name: Generate Readable Plan
        run: |
          terraform show -no-color tfplan > plan.txt

          {
            echo "## Terraform Plan Summary"
            echo ""
            grep -E '^Plan: |^No changes\.' \
              plan.txt | tail -n 1 || true
            echo ""
            echo "Review the plan.txt artifact before approval."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/tfplan
            infra/plan.txt
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # JOB 3 - MANUAL APPROVAL + TERRAFORM APPLY
  # ============================================
  apply:
    name: Production Approval and Apply
    needs: plan

    if: needs.plan.outputs.changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Validate Production Role
        env:
          ROLE_ARN: ${{ vars.TF_APPLY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::TF_APPLY_ROLE_ARN is missing"
            exit 1
          fi

          if [[ "$ROLE_ARN" != arn:aws:iam::136283260189:role/* ]]; then
            echo "::error::Invalid production role ARN"
            exit 1
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::GitHub OIDC is unavailable"
            exit 1
          fi

          echo "Production AWS role configured"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.DEPLOY_REGION }}
          role-session-name: TerraformApply-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra

      - name: Verify Plan Exists
        run: |
          test -f tfplan
          echo "Terraform saved plan downloaded"

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            tfplan

      - name: Deployment Summary
        run: |
          {
            echo "## Terraform Deployment"
            echo "Status: Success"
            echo "Environment: production"
            echo "AWS Region: us-east-1"
          } >> "$GITHUB_STEP_SUMMARY"
