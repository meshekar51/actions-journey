name: Cache Terraform AWS Provider

on:
  workflow_dispatch:

jobs:
  cache-check:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Restore Terraform plugin cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-

      - name: Configure Terraform plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          cat > "$HOME/.terraformrc" <<'EOF'
          plugin_cache_dir = "/home/runner/.terraform.d/plugin-cache"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Verify Cache
        run: |
          echo "Terraform plugin cache directory:"
          ls -la "$HOME/.terraform.d/plugin-cache"
