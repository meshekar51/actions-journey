name: Cache Terraform AWS Provider

on:
  workflow_dispatch:

jobs:
  cache-check:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Restore Terraform plugin cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: terraform-provider-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-provider-${{ runner.os }}-

      - name: Configure Terraform plugin cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          cat > "$HOME/.terraformrc" <<EOF
          plugin_cache_dir = "${TF_PLUGIN_CACHE_DIR}"
          EOF

      - name: Terraform Init
        run: terraform init -backend=false -input=false
