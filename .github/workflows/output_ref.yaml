name: output_check
on:
 workflow_dispatch:

jobs:
  output_generate:
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.generate.outputs.name }}
    steps:
      - id: generate
        run: echo 'name=${{ github.ref_name }}' >> $GITHUB_OUTPUT
  output_caller:
    runs-on: ubuntu-latest
    needs: output_generate
    steps:
      - name: check output
        run: echo '${{ needs.output_generate.outputs.check }}'
   
