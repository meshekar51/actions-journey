name: output_pratice
on: workflow_dispatch

jobs:
  output-job:
    runs-on: ubuntu-latest
    outputs:
        result: ${{ steps.output_id.outputs.ref }}

    steps:
        - id: output_id
          run: echo '${{ github.ref }}' >> $GITHUB_OUTPUT
  caller-job:
    runs-on: ubuntu-latest
    needs: output-job
    steps:
      - name: output check
        run: echo '${{ needs.output-job.outputs.result }}
    
