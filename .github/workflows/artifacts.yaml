name: artifacts_upload
on: workflow_dispatch
jobs:
 artifact_upload:
   runs-on: ubuntu-latest
   steps:
     - name: write to file
       run: echo "my name is chandra" | sudo tee -a test.txt
     - uses: actions/upload-artifact@v7
       with:
         name: my-artifact
         path: test.txt
 test-artifacts:
    runs-on: ubuntu-latest
    needs: artifact_upload
    steps:
     - uses: actions/download-artifact@v8
       with:
         name: my-artifact
     - name: Display structure of downloaded files
       run: cat test.txt
      
          
